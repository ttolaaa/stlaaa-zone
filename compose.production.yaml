services:
  portfolio:
    image: ${PORTFOLIO_IMAGE:?Set PORTFOLIO_IMAGE to the release image tag}
    pull_policy: never
    ports:
      - "${PORTFOLIO_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
